[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Busca as notícias todo dia às 00:00 (horário de Brasília = UTC-3, sem horário de verão)
[functions."fetch-news-background"]
  schedule = "0 3 * * *"

# Gera o carrossel do Instagram 15min depois, já com as notícias do dia prontas
[functions."generate-instagram-post"]
  schedule = "15 3 * * *"
  included_files = ["instagram/assets/**"]

# Mesma geração, mas disparável sob demanda (POST) pelo botão "gerar agora"
# do painel — funções agendadas não podem ser chamadas direto por HTTP.
[functions."trigger-instagram-post"]
  included_files = ["instagram/assets/**"]

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/get-news"
  status = 200

[[redirects]]
  from = "/api/instagram/post"
  to = "/.netlify/functions/get-instagram-post"
  status = 200

[[redirects]]
  from = "/api/instagram/image"
  to = "/.netlify/functions/get-instagram-image"
  status = 200

[[redirects]]
  from = "/api/instagram/generate"
  to = "/.netlify/functions/trigger-instagram-post"
  status = 200
